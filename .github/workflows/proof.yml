name: Proof Lab · Codec and RUL CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P1-P4 proof suite, local escape, mini BPE, no fabricated LLM numbers
        run: npm test
      - name: Produce reproducible P1-P3 diagnostic JSON report
        run: node scripts/run_eval.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: thuyettamphan-four-pillar-diagnostics
          path: reports/evaluation-v1.json
          if-no-files-found: error
  rul-native-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Actual RUL 128-bit binary graph verifier and differential engine
        run: cargo run --release --manifest-path rul-bridge/Cargo.toml
